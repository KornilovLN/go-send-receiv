version: '3.8'

services:
  receiver-service:
    build:
      context: .
      dockerfile: receiver-service/Dockerfile
    container_name: con-receiver
    ports:
      - "8080:8080"
    networks:
      - gendata-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  generator-service:
    build:
      context: .
      dockerfile: generator-service/Dockerfile
    container_name: con-gendata
    depends_on:
      receiver-service:
        condition: service_healthy
    networks:
      - gendata-network
    restart: unless-stopped
    environment:
      - RECEIVER_HOST=receiver-service
      - RECEIVER_PORT=8080
      - GENERATION_INTERVAL=5

networks:
  gendata-network:
    driver: bridge